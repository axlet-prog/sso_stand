services:
  sso-postgres:
    image: postgres:16
    container_name: sso-postgres
    ports:
      - "5431:5432"
    environment:
      POSTGRES_PASSWORD: "user"
      POSTGRES_USER: "user"
      POSTGRES_DB: "j-sso"
    restart: always
    volumes:
      - ./.docker/postgres/data:/var/lib/postgresql/data

  sso-redis:
    image: redis:7.4-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass qwerty12345678
    container_name: sso-redis
    ports:
      - '6379:6379'
