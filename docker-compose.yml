services:

  j-sso-client:
    build:
      context: ./backend/j-sso/client
    restart: unless-stopped
    environment:
      SSO_BACKEND_URL: ${SSO_BACKEND_URL:-http://j-sso-sever:7777}
    ports:
      - "127.0.0.1:8080:80"

  j-sso-sever:
    build:
      context: ./backend
      dockerfile: j-sso/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    env_file:
      - ./backend/j-sso/.env
    environment:
      SERVER_PORT: "7777"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      APP_FRONTEND_URL: http://localhost:8080
      SPRING_PROFILES_ACTIVE: development
      SPRING_DATASOURCE_URL: jdbc:postgresql://sso-postgres:5432/j-sso
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: user
      SPRING_DATA_REDIS_HOST: sso-redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: qwerty12345678
      SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ISSUERURL: http://localhost:8080
      SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_AUTHENTICATIONSUCCESSURL: http://localhost:8080/ui-test
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_YANDEX_REDIRECTURI: http://localhost:8080/login/oauth2/code/yandex
      SPRINGDOC_AUTHOAUTH_TOKENURL: http://localhost:8080/oauth2/token
      SPRINGDOC_AUTHOAUTH_AUTHORIZATIONURL: http://localhost:8080/oauth2/authorize
      SPRINGDOC_AUTHOAUTH_REFRESHURL: http://localhost:8080/oauth2/token
    depends_on:
      sso-postgres:
        condition: service_healthy
      sso-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:7777/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  sso-postgres:
    image: postgres:18
    container_name: sso-postgres
    ports:
      - "5431:5432"
    environment:
      POSTGRES_PASSWORD: "user"
      POSTGRES_USER: "user"
      POSTGRES_DB: "j-sso"
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  sso-redis:
    image: redis:7.4-alpine
    restart: always
    command: redis-server --save 20 1 --loglevel warning --requirepass qwerty12345678
    container_name: sso-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a qwerty12345678 ping | grep -qx PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
