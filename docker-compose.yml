services:
  sso-postgres:
    image: postgres:16
    container_name: sso-postgres
    ports:
      - "5431:5432"
    environment:
      POSTGRES_PASSWORD: "user"
      POSTGRES_USER: "user"
      POSTGRES_DB: "j-sso"
    restart: always
    volumes:
      - ./.docker/postgres/data:/var/lib/postgresql/data
