server:
  port: 7777

logging:
  level:
    root: debug
    org.apache.tomcat.util.net.NioEndpoint: error
    sun.rmi: error
    java.io: error
    javax.management: error

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: j-sso

  session:
    timeout: 1800
    redis:
      flush-mode: on_save
      namespace: j-sso:session
      save-mode: on_set_attribute
  data:
    redis:
      client-type: lettuce
      database: 0
      host: localhost
      port: 6379
      password: qwerty12345678
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  liquibase:
    enabled: true
    change-log: classpath:database/db.changelog.yaml
    contexts: dev, prod
  datasource:
    url: "jdbc:postgresql://localhost:5431/j-sso"
    username: "user"
    password: "user"
    driver-class-name: "org.postgresql.Driver"
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 10
      initialization-fail-timeout: 1
      leak-detection-threshold: 0
      pool-name: "HikariPool-j-sso"
      register-mbeans: true
  security:
    oauth2:
      authorizationserver:
        issuer-url: http://localhost:7777
        introspectionEndpoint: /oauth2/token-info
        authorization-ttl-ms: 720000
        authorization-consent-ttl-ms: 720000
      client:
        registration:
          github:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          yandex:
            provider: yandex
            clientId: ${YANDEX_CLIENT_ID}
            clientSecret: ${YANDEX_CLIENT_SECRET}
            redirect-uri: http://localhost:7777/login/oauth2/code/yandex
            authorizationGrantType: authorization_code
            clientName: Yandex

        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-name-attribute: default_email
            userInfoUri: https://login.yandex.ru/info
  mvc:
    cors:
      configs:
        - pattern: /v3/api-docs
          allowed-origins: "http://localhost:7778"
          allowed-headers: "*"
          exposed-headers: "*"
          allowed-methods: "*"
          allow-credentials: true
        - pattern: /**
          allowed-origins: "http://127.0.0.1:8080,http://localhost:8080"
          allowed-headers: "*"
          exposed-headers: "*"
          allowed-methods: "*"
          allow-credentials: true
springdoc:
  swagger-ui:
    enabled: true
    use-root-path: true
    path: /swagger-ui
    doc-expansion: none
    config-url: /v3/api-docs/swagger-config
    disable-swagger-default-url: true
    operationsSorter: method
    tagsSorter: alpha
    url: /v3/api-docs
    try-it-out-enabled: true
    api-docs:
      enabled: true
      path: /v3/api-docs
---
spring:
  config:
    activate:
      on-profile: production
    liquibase:
      contexts: prod

---
spring:
  config:
    activate:
      on-profile: development
    liquibase:
      contexts: prod, dev
