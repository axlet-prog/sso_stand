spring:
  application:
    name: j-swagger-ui
server:
  port: 7778


springdoc:
  swagger-ui:
    enabled: true
    use-root-path: true
    doc-expansion: none
    disable-swagger-default-url: true
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    urls:
      - name: SSO Server
        url: http://localhost:7777/v3/api-docs
      - name: J resource
        url: http://localhost:9001/v3/api-docs
  api-docs:
    enabled: true
