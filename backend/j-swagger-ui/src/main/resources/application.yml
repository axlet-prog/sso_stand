spring:
  application:
    name: j-swagger-ui
server:
  port: ${SERVER_PORT:7778}


springdoc:
  swagger-ui:
    enabled: true
    use-root-path: true
    doc-expansion: none
    disable-swagger-default-url: true
    operationsSorter: method
    tagsSorter: alpha
    try-it-out-enabled: true
    urls:
      - name: SSO Server
        url: ${SSO_API_DOCS_URL:http://localhost:7777/v3/api-docs}
      - name: J resource
        url: ${RESOURCE_API_DOCS_URL:http://localhost:9001/v3/api-docs}
  api-docs:
    enabled: true
