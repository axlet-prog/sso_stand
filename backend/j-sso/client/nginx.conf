server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /static/ {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files /static/index.html =404;
    }
}
