server:
  port: ${SERVER_PORT:7777}

app:
  frontend-url: ${APP_FRONTEND_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:debug}
    org.springframework.security.web.FilterChainProxy: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_WEB_FILTERCHAINPROXY:TRACE}
    org.springframework.security: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:TRACE}
    org.apache.tomcat.util.net.NioEndpoint: error
    sun.rmi: error
    java.io: error
    javax.management: error

springdoc:
  auth-types:
    auth-header-enabled: true
    client-credentials-enabled: true
    authorization-code-enabled: true
  auth-oauth:
    token-url: ${SPRINGDOC_AUTHOAUTH_TOKENURL:http://localhost:7777/oauth2/token}
    authorization_url: ${SPRINGDOC_AUTHOAUTH_AUTHORIZATIONURL:http://localhost:7777/oauth2/authorize}
    refresh-url: ${SPRINGDOC_AUTHOAUTH_REFRESHURL:http://localhost:7777/oauth2/token}
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
    path: /v3/api-docs

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: j-sso

  session:
    timeout: ${SPRING_SESSION_TIMEOUT:1800}
    data:
      redis:
        flush-mode: on_save
        namespace: ${SPRING_SESSION_DATA_REDIS_NAMESPACE:j-sso:session}
        save-mode: on_set_attribute
  data:
    redis:
      client-type: lettuce
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:qwerty12345678}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:database/db.changelog.yaml
    contexts: ${SPRING_LIQUIBASE_CONTEXTS:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/j-sso}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:user}
    driver-class-name: "org.postgresql.Driver"
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 10
      initialization-fail-timeout: 1
      leak-detection-threshold: 0
      pool-name: "HikariPool-j-sso"
      register-mbeans: true
  security:
    oauth2:
      authorizationserver:
        issuer-url: ${SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_ISSUERURL:http://localhost:7777}
        introspectionEndpoint: ${SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_INTROSPECTIONENDPOINT:/oauth2/token-info}
        authorization-ttl-ms: ${SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_AUTHORIZATIONTTLMS:720000}
        authorization-consent-ttl-ms: ${SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_AUTHORIZATIONCONSENTTTLMS:720000}
        custom-handler-header-name: ${SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_CUSTOMHANDLERHEADERNAME:J-Sso-Next-Location}
        authentication-success-url: ${SPRING_SECURITY_OAUTH2_AUTHORIZATIONSERVER_AUTHENTICATIONSUCCESSURL:http://localhost:7777/}
      client:
        registration:
          github:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          yandex:
            provider: yandex
            clientId: ${YANDEX_CLIENT_ID}
            clientSecret: ${YANDEX_CLIENT_SECRET}
            redirect-uri: ${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_YANDEX_REDIRECTURI:http://localhost:7777/login/oauth2/code/yandex}
            authorizationGrantType: authorization_code
            clientName: Yandex

        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-name-attribute: default_email
            userInfoUri: https://login.yandex.ru/info
  mvc:
    static-path-pattern: /static/**
    cors:
      configs:
        - pattern: /**
          allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8080,http://localhost:8080,http://localhost:7778}
          allowed-headers: "*"
          exposed-headers: ${spring.security.oauth2.authorizationserver.custom-handler-header-name}
          allowed-methods: "*"
          allow-credentials: true
  web:
    resources:
      static-locations: classpath:static
---
spring:
  config:
    activate:
      on-profile: production
  liquibase:
    contexts: ${SPRING_LIQUIBASE_CONTEXTS:prod}

---
spring:
  config:
    activate:
      on-profile: development
  liquibase:
    contexts: ${SPRING_LIQUIBASE_CONTEXTS:prod, dev}
