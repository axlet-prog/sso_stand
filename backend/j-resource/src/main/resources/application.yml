server:
  port: ${SERVER_PORT:9001}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:DEBUG}
    javax.management: ERROR
    org.springframework.security.web.FilterChainProxy: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_WEB_FILTERCHAINPROXY:DEBUG}

springdoc:
  auth-types:
    auth-header-enabled: true
    client-credentials-enabled: true
    authorization-code-enabled: true
  auth-oauth:
    token-url: ${SPRINGDOC_AUTHOAUTH_TOKENURL:http://localhost:8080/oauth2/token}
    authorization_url: ${SPRINGDOC_AUTHOAUTH_AUTHORIZATIONURL:http://localhost:8080/oauth2/authorize}
    refresh-url: ${SPRINGDOC_AUTHOAUTH_REFRESHURL:http://localhost:8080/oauth2/token}
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
    path: /v3/api-docs

spring:
  application:
    name: j-resource
  mvc:
    cors:
      configs:
        - pattern: /**
          allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:7778}
          allowed-headers: "*"
          exposed-headers: "*"
          allowed-methods: "*"
          allow-credentials: true
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          client-id: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTID:test-client}
          client-secret: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_CLIENTSECRET:test-client}
          introspection-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_OPAQUETOKEN_INTROSPECTIONURI:http://localhost:8080/oauth2/token-info}
